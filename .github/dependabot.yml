version: 2
updates:
  - package-ecosystem: uv
    directories: ["/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
